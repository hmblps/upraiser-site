<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=320,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ING Rich Media</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{width:320px;height:844px;overflow:hidden;background:#0a0a0a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}

  /* ─── Layout ─── */
  .ad{position:relative;width:320px;height:844px;display:flex;flex-direction:column;overflow:hidden}

  /* ─── Video slot ─── */
  .video-wrap{position:relative;width:100%;height:338px;background:#000;flex-shrink:0;overflow:hidden}
  .ad-video{width:100%;height:100%;object-fit:cover;display:block}
  /* Cover burned-in subtitles at bottom of video */
  .subtitle-cover{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(to bottom,transparent 0%,rgba(0,0,0,.85) 50%,#000 100%);pointer-events:none;z-index:3}
  .subtitle-solid{position:absolute;bottom:0;left:0;right:0;height:44px;background:#000;pointer-events:none;z-index:4}
  .mute-btn{position:absolute;bottom:10px;right:10px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;font-size:12px;z-index:10;transition:background .2s}
  .mute-btn:hover{background:rgba(0,0,0,.75)}

  /* ─── Brand panel ─── */
  .brand-panel{flex:1;background:#f5f0e8;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:18px 20px 60px;overflow:hidden}
  .headline{font-size:22px;font-weight:800;color:#ff6200;text-align:center;line-height:1.2;margin-bottom:14px;z-index:2}
  .shredder-scene{position:relative;width:200px;height:180px;cursor:pointer;z-index:2;flex-shrink:0}

  /* Shredder machine */
  .shredder-body{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:160px;height:120px;background:linear-gradient(160deg,#ff7c2a,#ff5c00,#c94200);border-radius:12px 12px 10px 10px;box-shadow:0 6px 20px rgba(180,50,0,.4),inset 0 1px 0 rgba(255,180,100,.3)}
  .shredder-slot{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:14px;background:#000;border-radius:3px;box-shadow:inset 0 2px 4px rgba(0,0,0,.8)}
  .shredder-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ffb347,#ff6200 45%,#c94200);box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,200,120,.5);display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s;cursor:pointer}
  .shredder-btn:hover{transform:translate(-50%,-50%) scale(1.06)}
  .shredder-btn:active{transform:translate(-50%,-50%) scale(0.94);box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .shredder-logo{font-size:13px;font-weight:900;color:#fff;letter-spacing:.5px;text-align:center;line-height:1;user-select:none}
  .shredder-legs{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);display:flex;gap:40px}
  .leg{width:14px;height:22px;background:linear-gradient(180deg,#d44800,#a83500);border-radius:0 0 5px 5px}
  .ing-brand{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:18px;font-weight:900;color:#ff6200;letter-spacing:-.5px;opacity:.5;user-select:none}

  /* ─── Papers ─── */
  .papers-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:20}
  .paper{position:absolute;width:38px;height:52px;background:#fff;border-radius:3px;box-shadow:0 3px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;font-size:7.5px;font-weight:700;color:#ff6200;line-height:1.4;padding:4px;text-align:center;pointer-events:none;gap:1px}
  .paper-line{width:70%;height:2px;background:#f0d0c0;border-radius:1px}
  .paper-val{font-size:11px;font-weight:900;color:#ff6200}

  /* ─── Bottom bar ─── */
  .bottom-bar{position:absolute;bottom:0;left:0;right:0;height:58px;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:30;gap:10px}
  .disclaimer{font-size:9.5px;color:#555;line-height:1.35;max-width:195px}
  .cta-btn{flex-shrink:0;height:36px;padding:0 18px;background:#ff6200;color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:background .18s,transform .12s;white-space:nowrap;touch-action:manipulation}
  .cta-btn:hover{background:#e85500}
  .cta-btn:active{transform:scale(.95)}

  /* ─── Shredded output (strips) ─── */
  .shred-output{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);display:flex;gap:2px;pointer-events:none;overflow:hidden;width:130px;height:0;transition:height .3s .2s}
  .strip{width:7px;border-radius:0 0 3px 3px;background:linear-gradient(180deg,#e8e8e8,#ccc);opacity:.9}

  /* ─── Animations ─── */
  @keyframes flyIn{
    0%{opacity:1;transform:rotate(var(--r0))}
    75%{opacity:1}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r1)) scale(.5)}
  }
  @keyframes pulseBtn{
    0%,100%{box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,200,120,.5)}
    50%{box-shadow:0 4px 24px rgba(255,98,0,.6),inset 0 1px 0 rgba(255,200,120,.5)}
  }
  .shredder-btn.idle{animation:pulseBtn 2.5s ease-in-out infinite}
</style>
</head>
<body>
<div class="ad">

  <!-- VIDEO SLOT -->
  <div class="video-wrap">
    <video class="ad-video" id="adVideo" autoplay muted playsinline loop preload="auto"
           poster="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wAARCAAoAFADASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAABAUCAwYBAAf/xAAqEAABBAEDBAICAgMAAAAAAAABAAIDEQQSITFBBRNRYRQyI3EGUoH/xAAYAQADAQEAAAAAAAAAAAAAAAABAgMABP/EAB8RAAICAwACAwAAAAAAAAAAAAECAAMREiExQWH/2gAMAwEAAhEDEQA/APlNxdZ5BnXK7c5oN7yxg7AHqT9lbE42wWx4i2sB+5oKjqmDhrFSBiRiDEYxBkrJiWkbD6o1A27YqxaJoaRZIKJWQhTqFY2CiJFNFJSTdoRR4lR+VYCq1e+Z7hJjFOXY8YYg4oLQADt7rPi10DoxFRHBHYPLgaAFMHJDJcFYUOVVaJnkY0RWCJ0BcCCpqLBhGCFjkQo2V0LcgGRiUElxbBJjmOqN0bkpGqPjGhcMg0eLfgLSL5HCiCe3bsVm16OV+VJqWGQCvAWjcaVJhyv8ATVJpv3ywuPoCrGxtnivAKWZiGKv2sHiKLHF5sJPTJ5BOFpqKuQ9hE8n8q2VN11t2bFjaTgIBHk9kN4WBVmtxVCRqYISiIjBTOEiXR3FcJD2jWyQu0N8jkXeUrZ6LDH5v9Z1KNnBRGPK0HaFjwNYB4LQ2/pJb//Z">
      <source src="/ing-ad.mp4#t=10" type="video/mp4">
    </video>
    <div class="subtitle-cover"></div>
    <div class="subtitle-solid"></div>
    <div class="mute-btn" id="muteBtn" title="Toggle sound">🔇</div>
  </div>

  <!-- BRAND PANEL -->
  <div class="brand-panel">
    <div class="headline">Switch to ING.<br>Zero fees, forever.</div>

    <!-- Shredder machine (clickable) -->
    <div class="shredder-scene" id="shredderScene" onclick="triggerShredder()">
      <div class="shredder-body">
        <div class="shredder-slot"></div>
        <div class="shredder-btn idle" id="shredBtn">
          <div class="shredder-logo">ING 🦁</div>
        </div>
      </div>
      <div class="shredder-legs">
        <div class="leg"></div>
        <div class="leg"></div>
      </div>
      <!-- Shredded strips output -->
      <div class="shred-output" id="shredOutput">
        <div class="strip" style="height:45px"></div>
        <div class="strip" style="height:60px"></div>
        <div class="strip" style="height:38px"></div>
        <div class="strip" style="height:52px"></div>
        <div class="strip" style="height:44px"></div>
        <div class="strip" style="height:57px"></div>
        <div class="strip" style="height:41px"></div>
        <div class="strip" style="height:49px"></div>
        <div class="strip" style="height:55px"></div>
        <div class="strip" style="height:42px"></div>
        <div class="strip" style="height:53px"></div>
        <div class="strip" style="height:46px"></div>
      </div>
    </div>

    <!-- Papers layer (animated) -->
    <div class="papers-container" id="papersContainer"></div>

    <div class="ing-brand">ING 🦁</div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <div class="disclaimer">No wire fees, no transfer charges, no annual card fee. Not one.*</div>
    <button class="cta-btn" onclick="openING()">Open ING</button>
  </div>
</div>

<script>
// ── Mute toggle ──
var video = document.getElementById('adVideo');
var muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  video.muted = !video.muted;
  muteBtn.textContent = video.muted ? '🔇' : '🔊';
});

// ── Shredder animation ──
var shredding = false;
var shredBtn = document.getElementById('shredBtn');
var shredOutput = document.getElementById('shredOutput');
var papersContainer = document.getElementById('papersContainer');
var shredScene = document.getElementById('shredderScene');

function triggerShredder() {
  if (shredding) return;
  shredding = true;
  shredBtn.classList.remove('idle');
  shredBtn.style.animation = 'none';

  // Shake the shredder
  var shredBody = shredScene.querySelector('.shredder-body');
  shredBody.style.transition = 'transform .08s';
  var shakes = [-.02,0.02,-.015,0.015,-0.01,0];
  var si = 0;
  var shakeInt = setInterval(function(){
    if(si>=shakes.length){clearInterval(shakeInt); shredBody.style.transform=''; return;}
    shredBody.style.transform='rotate('+shakes[si]+'rad)';
    si++;
  },80);

  // Launch papers — compute slot position relative to papersContainer
  var paperTexts = ['Annual\nFee','Wire\nFee','Card\nFee','Transfer','ATM'];
  var containerRect = papersContainer.getBoundingClientRect();
  var slotEl = shredScene.querySelector('.shredder-slot');
  var slotRect = slotEl.getBoundingClientRect();
  // Target: center of slot in papersContainer coordinate space
  var targetX = slotRect.left + slotRect.width / 2 - containerRect.left;
  var targetY = slotRect.top + slotRect.height / 2 - containerRect.top;

  for(var i=0;i<9;i++){
    (function(idx){
      setTimeout(function(){
        var p = document.createElement('div');
        p.className = 'paper';
        var label = paperTexts[idx % paperTexts.length];
        p.innerHTML = '<div class="paper-line"></div><div class="paper-val">€0</div><div style="font-size:7px;font-weight:600;color:#cc4400">'+label+'</div><div class="paper-line"></div>';

        // Start: random scatter around the panel, NOT near the slot
        var startX = 20 + Math.random() * (containerRect.width - 58);
        // Keep papers in lower 2/3 of panel, away from slot
        var startY = 140 + Math.random() * 200;
        // Delta to slot
        var tx = (targetX - startX - 19) + 'px'; // 19 = half paper width
        var ty = (targetY - startY - 26) + 'px'; // 26 = half paper height
        var r0 = (Math.random() * 30 - 15) + 'deg';
        var r1 = (Math.random() * 360 - 180) + 'deg';

        p.style.left = startX + 'px';
        p.style.top = startY + 'px';
        p.style.setProperty('--tx', tx);
        p.style.setProperty('--ty', ty);
        p.style.setProperty('--r0', r0);
        p.style.setProperty('--r1', r1);
        p.style.animation = 'flyIn ' + (0.8 + Math.random()*0.4) + 's ease-in forwards';

        papersContainer.appendChild(p);
        setTimeout(function(){ p.remove(); }, 1200);
      }, idx * 70);
    })(i);
  }

  // Show shredded output
  setTimeout(function(){
    shredOutput.style.height = '55px';
  }, 400);

  // Reset after 2.5s
  setTimeout(function(){
    shredding = false;
    shredOutput.style.height = '0';
    shredBtn.classList.add('idle');
  }, 2500);
}

function openING() {
  triggerShredder();
}

// ── Auto-play video ──
video.play().catch(function(){});
</script>
</body>
</html>
