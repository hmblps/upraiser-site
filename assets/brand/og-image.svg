<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="baseGrade" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1.02 0 0 0 0.02  0 1.02 0 0 0.02  0 0 0.94 0 0.02  0 0 0 1 0"/>
    </filter>
    <filter id="litGrade" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="1.08 0 0 0 0.06  0 1.12 0 0 0.04  0 0 1.06 0 0.04  0 0 0 1 0"/>
    </filter>
    <radialGradient id="litMaskGrad" cx="840" cy="214" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0.68"/>
      <stop offset="64%" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="litMask">
      <rect width="1200" height="630" fill="url(#litMaskGrad)"/>
    </mask>
    <linearGradient id="scrimTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffbf7"/>
      <stop offset="28%" stop-color="#fffbf7" stop-opacity="0.88"/>
      <stop offset="58%" stop-color="#fffbf7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrimBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fffbf7"/>
      <stop offset="22%" stop-color="#fffbf7" stop-opacity="0.7"/>
      <stop offset="48%" stop-color="#fffbf7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="scrimLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fffbf7" stop-opacity="0.97"/>
      <stop offset="52%" stop-color="#fffbf7" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#fffbf7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="840" cy="214" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#e8a500" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#e8a500" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#fffbf7"/>

  <image href=".og-hero-frame.jpg" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="0.28" filter="url(#baseGrade)"/>
  <g mask="url(#litMask)">
    <image href=".og-hero-frame.jpg" x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" opacity="0.9" filter="url(#litGrade)"/>
  </g>

  <rect width="1200" height="630" fill="#fffbf7" opacity="0.35" style="mix-blend-mode:soft-light"/>
  <rect width="1200" height="630" fill="url(#scrimTop)"/>
  <rect width="1200" height="630" fill="url(#scrimBottom)"/>
  <rect width="1200" height="630" fill="url(#scrimLeft)"/>
  <ellipse cx="920" cy="240" rx="340" ry="260" fill="url(#goldGlow)" filter="url(#softBlur)"/>

  <!-- OG layout: logo + aligned wordmark row, large headline below -->
  <g transform="translate(72, 88)">
    <image href="favicon.png" x="0" y="0" width="208" height="208" preserveAspectRatio="xMidYMid meet"/>

    <!-- Wordmark stack — vertically centred against logo -->
    <g transform="translate(240, 68)">
      <text font-family="Inter" font-size="58" font-weight="800" letter-spacing="0.05em" fill="#141010">UPRAISER</text>
      <text y="40" font-family="Inter" font-size="18" font-weight="600" letter-spacing="0.14em" fill="#e63558">CHARTING THE ASCENT</text>
    </g>

    <!-- Headline — same left edge as logo, fills remaining canvas -->
    <text y="252" font-family="Inter" font-size="84" font-weight="800" letter-spacing="0.01em" fill="#141010">
      <tspan x="0" dy="0">WE SEE HOW STUNNING</tspan>
      <tspan x="0" dy="92">YOUR RISE TO THE TOP</tspan>
      <tspan x="0" dy="92">CAN BE.</tspan>
    </text>
  </g>
</svg>
