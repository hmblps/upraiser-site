<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var mobile = window.matchMedia("(max-width: 899px)").matches;
        var stored = localStorage.getItem("upraiser-theme");
        var t = mobile
          ? "light"
          : stored === "light" || stored === "dark"
            ? stored
            : "dark";
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        if (/Windows/i.test(navigator.userAgent)) {
          document.documentElement.dataset.os = "windows";
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "light" ? "#ffffff" : "#050504");
        // Tall sticky hero — kill browser scroll restore before React/Lenis boot.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        if (!location.hash) {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }
        // Desktop WebGL Everest — start GLB + Draco before React/idle work.
        if (!mobile) {
          var glb = t === "light" ? "/hero/everest-light.glb" : "/hero/everest.glb";
          function preload(href, as) {
            var l = document.createElement("link");
            l.rel = "preload";
            l.href = href;
            l.as = as;
            l.crossOrigin = "anonymous";
            l.setAttribute("fetchpriority", "high");
            document.head.appendChild(l);
          }
          preload(glb, "fetch");
          preload("/draco/gltf/draco_wasm_wrapper.js", "script");
          preload("/draco/gltf/draco_decoder.wasm", "fetch");
        }
      })();
    </script>
