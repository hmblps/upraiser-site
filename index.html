<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var host = window.location.hostname;
          if (host && host.endsWith("vercel.app")) {
            var metaRobots = document.createElement("meta");
            metaRobots.name = "robots";
            metaRobots.content = "noindex, nofollow, noarchive";
            document.head.appendChild(metaRobots);
            var target = "https://upraiser.co.uk" + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(target);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        var mobile = window.matchMedia("(max-width: 899px)").matches;
        var stored = localStorage.getItem("upraiser-theme");
        var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var defaultTheme = systemDark ? "dark" : "light";
        var t = mobile
          ? "light"
          : stored === "light" || stored === "dark"
            ? stored
            : defaultTheme;
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
        var isWinPort = window.location.port === "5174";
        var urlParams = new URLSearchParams(window.location.search);
        var osParam = urlParams.get("os");
        if (osParam) {
          if (osParam === "windows" || osParam === "mac") {
            try { sessionStorage.setItem("upraiser-os", osParam); } catch (e) {}
          } else if (osParam === "reset") {
            try { sessionStorage.removeItem("upraiser-os"); } catch (e) {}
          }
        }
        var activeOs = osParam || (function() { try { return sessionStorage.getItem("upraiser-os"); } catch(e) { return null; } })();
        if (activeOs === "windows" || activeOs === "mac") {
          document.documentElement.dataset.os = activeOs;
        } else if (isWinPort) {
          document.documentElement.dataset.os = "windows";
        } else if (/Windows/i.test(navigator.userAgent)) {
          document.documentElement.dataset.os = "windows";
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "light" ? "#ffffff" : "#050504");
        // Tall sticky hero — kill browser scroll restore before React/Lenis boot.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        if (!location.hash) {
          window.scrollTo(0, 0);
          if (document.documentElement) document.documentElement.scrollTop = 0;
          if (document.body) document.body.scrollTop = 0;
        }
        
                // Preload the primary hero video for LCP
        var v = t === "light" ? "/hero/home-light-idle.mp4" : "/hero/home-dark-idle.mp4";
        var l = document.createElement("link");
        l.rel = "preload";
        l.href = v;
        l.as = "fetch";
        l.crossOrigin = "anonymous";
        l.setAttribute("fetchpriority", "high");
        document.head.appendChild(l);

        // Preload the poster image for instant first paint
        var pImg = t === "light" ? "/hero/home-light-poster.jpg" : "/hero/home-dark-poster.jpg";
        var pl = document.createElement("link");
        pl.rel = "preload";
        pl.href = pImg;
        pl.as = "image";
        pl.setAttribute("fetchpriority", "high");
        document.head.appendChild(pl);

      })();
    </script>
