<svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" className="font-mono text-[11px] uppercase tracking-widest font-semibold">
  
  {/* Mountain Ridges (Subtle Background) */}
  <path d="M100,900 L150,750 L280,600 L320,550 L380,400 L450,250 L500,150 L580,250 L650,350 L780,450 L900,500" stroke="currentColor" strokeWidth="2" strokeDasharray="4 8" opacity="0.4" />
  <path d="M280,600 L400,650 L550,750 L750,900" stroke="currentColor" strokeWidth="2" strokeDasharray="4 8" opacity="0.4" />
  <path d="M500,150 L600,280 L850,350" stroke="currentColor" strokeWidth="2" strokeDasharray="4 8" opacity="0.4" />

  {/* Climbing Routes (Sharp Lines) */}
  
  {/* Left Ridge (North Ridge) */}
  <path d="M150,800 L200,650 L250,500 L320,380 L420,250 L500,150" stroke="currentColor" strokeWidth="3" strokeLinejoin="bevel" />
  
  {/* North Face Route 1 */}
  <path d="M350,850 L380,650 L400,500 L420,250" stroke="currentColor" strokeWidth="3" strokeLinejoin="bevel" />

  {/* North Face Route 2 */}
  <path d="M480,850 L480,600 L470,400 L480,250 L500,150" stroke="currentColor" strokeWidth="3" strokeLinejoin="bevel" />

  {/* West Ridge */}
  <path d="M500,150 L530,280 L620,400 L750,550 L720,700 L750,900" stroke="currentColor" strokeWidth="3" strokeLinejoin="bevel" />

  {/* South West Face */}
  <path d="M500,150 L620,300 L750,450 L850,550" stroke="currentColor" strokeWidth="3" strokeLinejoin="bevel" />

  {/* Connectors / Traverses */}
  <path d="M250,500 L400,500" stroke="currentColor" strokeWidth="2.5" />
  <path d="M320,380 L470,400" stroke="currentColor" strokeWidth="2.5" />
  <path d="M530,280 L620,300" stroke="currentColor" strokeWidth="2.5" />
  <path d="M620,400 L750,450" stroke="currentColor" strokeWidth="2.5" />

  {/* Nodes & Labels */}
  <g className="text-current">
    {/* Summit */}
    <circle cx="500" cy="150" r="10" fill="currentColor"/>
    <text x="500" y="120" textAnchor="middle" className="text-[14px]">THE SUMMIT</text>
    <text x="500" y="135" textAnchor="middle" opacity="0.6" className="text-[10px]">8,848M</text>

    {/* North Col */}
    <circle cx="200" cy="650" r="7" fill="currentColor"/>
    <text x="185" y="654" textAnchor="end">NORTH COL</text>
    
    {/* North Ridge */}
    <circle cx="320" cy="380" r="7" fill="currentColor"/>
    <text x="305" y="384" textAnchor="end">NORTH RIDGE</text>

    {/* North Face */}
    <circle cx="470" cy="400" r="7" fill="currentColor"/>
    <text x="455" y="404" textAnchor="end">NORTH FACE</text>

    {/* South Col */}
    <circle cx="620" cy="300" r="7" fill="currentColor"/>
    <text x="635" y="304" textAnchor="start">SOUTH COL</text>

    {/* West Ridge */}
    <circle cx="620" cy="400" r="7" fill="currentColor"/>
    <text x="635" y="404" textAnchor="start">WEST RIDGE</text>

    {/* Ice Field */}
    <circle cx="750" cy="550" r="7" fill="currentColor"/>
    <text x="765" y="554" textAnchor="start">ICE FIELD (6100M)</text>

    {/* Basecamps */}
    <circle cx="350" cy="850" r="8" fill="currentColor"/>
    <text x="350" y="875" textAnchor="middle">RONGBUK GLACIER</text>

    <circle cx="750" cy="900" r="8" fill="currentColor"/>
    <text x="750" y="925" textAnchor="middle">KHUMBU GLACIER</text>
  </g>
</svg>
